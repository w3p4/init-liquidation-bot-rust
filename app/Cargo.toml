[package]
name = "app"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
foundry-contracts.workspace = true
eyre = "0.6"
tokio = { version = "1.19", features = ["macros", "rt-multi-thread"] }
alloy = { version = "0.12.0", features = ["full", "signer-local", "contract"] }
alloy-signer-local = { version = "0.12.0", features = ["mnemonic"] }


serde_json = "1.0.132"
reqwest = "0.12.8"
serde = "1.0.210"
futures = "0.3.31"
tracing = "0.1"
thiserror = "1.0"
redis = "0.28.2"
dotenv = "0.15.0"
